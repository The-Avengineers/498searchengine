# nginx reverse proxy for theavengine.com
# Terminates SSL and forwards all traffic to the search server container.
#
# Prerequisites on the coordinator VM:
#   certbot certonly --standalone -d theavengine.com -d www.theavengine.com
#
# Auto-renew (add to crontab):
#   0 3 * * * certbot renew --quiet && docker compose -f docker-compose.nginx.yml exec nginx nginx -s reload

server {
    listen 80;
    server_name theavengine.com www.theavengine.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name theavengine.com www.theavengine.com;

    ssl_certificate     /etc/letsencrypt/live/theavengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theavengine.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
