services:
  avengine:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: avengine-runtime:latest
    container_name: avengine-runtime
    restart: unless-stopped
    environment:
      AVENGINE_SSH_PUBKEY: ${AVENGINE_SSH_PUBKEY}
      AVENGINE_SWARM_SIZE: ${AVENGINE_SWARM_SIZE:-4}
      AVENGINE_CRAWLER_WORKERS: ${AVENGINE_CRAWLER_WORKERS:-64}
      AVENGINE_AUTO_SWARM: ${AVENGINE_AUTO_SWARM:-1}
      AVENGINE_AUTO_AGGREGATE: ${AVENGINE_AUTO_AGGREGATE:-1}
      AVENGINE_AGGREGATE_INTERVAL_SECONDS: ${AVENGINE_AGGREGATE_INTERVAL_SECONDS:-300}
    ports:
      - "${AVENGINE_SSH_PORT:-2222}:22"
    volumes:
      - avengine-data:/data
      - ./authorized_keys:/run/avengine/authorized_keys:ro

volumes:
  avengine-data:
