services:
  caddy:
    image: caddy:2-alpine
    container_name: avengine-caddy
    restart: unless-stopped
    depends_on:
      - avengine
    environment:
      AVENGINE_DOMAIN: ${AVENGINE_DOMAIN:-theavengine.com}
    ports:
      - "${AVENGINE_PUBLIC_HTTP_PORT:-80}:80"
      - "${AVENGINE_PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
