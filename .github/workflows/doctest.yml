name: Doctest

on:
  pull_request:
    branches: [main, master]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "tests/**"
      - ".github/workflows/doctest.yml"
  push:
    branches: [main, master]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "tests/**"
      - ".github/workflows/doctest.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ doctest-dev ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-doctest-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-doctest-
          max-size: 500M

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
