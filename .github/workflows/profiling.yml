name: Profiling

concurrency:
  group: profiling-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  corpus-profile:
    runs-on: [self-hosted, linux, x64, avengine]
    timeout-minutes: 90
    env:
      CORPUS_INDEX_TAG: corpus-index-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3 python3-pip ccache gh libssl-dev zlib1g-dev

      - name: Install CMake
        run: |
          python3 -m pip install --user "cmake>=3.20"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-corpus-profile-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-corpus-profile-
          max-size: 500M

      - name: Restore corpus index from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: corpus-index/
          key: ${{ env.CORPUS_INDEX_TAG }}

      - name: Download corpus index from release
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p corpus-index
          gh release download "$CORPUS_INDEX_TAG" \
            --repo "${{ github.repository }}" \
            --dir corpus-index/ \
            --pattern "*.sfi"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate corpus index
        run: |
          count=$(ls corpus-index/*.sfi 2>/dev/null | wc -l | tr -d ' ')
          echo "Found ${count} .sfi shard(s) in corpus-index/"
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::No .sfi files found — corpus download failed or release has no assets. Run profiling/scripts/upload_corpus_index.sh to publish the index."
            exit 1
          fi

      - name: Run corpus profile
        run: |
          mkdir -p artifacts
          bash profiling/scripts/profile_query_pipeline.sh \
            --index-dir corpus-index/ \
            --iterations 50 \
            --output artifacts/corpus_profile.json \
            2>&1 | tee /dev/stderr | grep -v "^$" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-profile
          path: artifacts/corpus_profile.json
