name: Deploy avengine

on:
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "examples/**"
      - "tests/**"
      - "deploy/**"
      - "infra/deploy/**"
      - ".github/workflows/deploy-avengine.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, avengine]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH public key secret
        shell: bash
        run: |
          if [[ -z "${{ secrets.AVENGINE_SSH_PUBKEY }}" ]]; then
            echo "Missing required repo secret: AVENGINE_SSH_PUBKEY"
            exit 1
          fi

      - name: Deploy container
        shell: bash
        env:
          AVENGINE_SSH_PUBKEY: ${{ secrets.AVENGINE_SSH_PUBKEY }}
          AVENGINE_SSH_PORT: ${{ vars.AVENGINE_SSH_PORT || '2222' }}
        run: |
          docker compose \
            -f infra/deploy/docker-compose.avengine.yml \
            up -d --build --remove-orphans

      - name: Deployment status
        shell: bash
        run: |
          docker compose -f infra/deploy/docker-compose.avengine.yml ps
