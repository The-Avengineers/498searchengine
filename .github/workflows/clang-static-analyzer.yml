name: Clang Static Analyzer

on:
  pull_request:
    branches: [main, master]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build clang-tools

      - name: Configure with scan-build (avengine)
        run: |
          scan-build --status-bugs cmake -S avengine -B build-sa -G Ninja \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build with scan-build
        run: |
          scan-build --status-bugs cmake --build build-sa -j
