name: Clang-Tidy

on:
  pull_request:
    branches: [main, master]

jobs:
  tidy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build clang-tidy clang-tools ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-clang-tidy-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-tidy-
          max-size: 500M

      - name: Configure (GCC)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run clang-tidy
        run: |
          files=$(find src include tests -type f \( \
            -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
            -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' \
          \))
          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi

          run-clang-tidy -p build $files
