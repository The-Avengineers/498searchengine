name: Clang-Format Auto-Fix

on:
  push:
    branches-ignore: [main, master]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format sources
        run: |
          files=$(find src include tests -type f \( \
            -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
            -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' \
          \))
          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi
          echo "$files" | xargs -r clang-format -i

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src include tests .clang-format .clang-tidy
          git commit -m "chore: auto-format C/C++ sources"
          git push
