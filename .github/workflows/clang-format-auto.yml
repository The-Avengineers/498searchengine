name: Clang-Format Auto-Fix

on:
  push:
    branches-ignore: [main, master]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format avengine sources
        working-directory: avengine
        run: |
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp')
          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi
          echo "$files" | xargs -r clang-format -i

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avengine
          git commit -m "chore: auto-format avengine C/C++ sources"
          git push
