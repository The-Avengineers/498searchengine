name: Live Internet Crawl

concurrency:
  group: avengine-runtime-service
  cancel-in-progress: false

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  live-crawl:
    runs-on: [self-hosted, linux, x64, avengine-runtime]
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CORPUS_PROFILE_ITERATIONS: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3 python3-pip ccache

      - name: Install CMake
        shell: bash
        run: |
          python3 -m pip install --user "cmake>=3.20"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version

      - name: Validate long-lived runtime service
        shell: bash
        run: |
          if ! docker inspect avengine-runtime >/dev/null 2>&1; then
            echo "::error::Container avengine-runtime was not found on this runner. Deploy the long-lived runtime service to the dedicated avengine-runtime self-hosted runner first."
            exit 1
          fi
          running=$(docker inspect -f '{{.State.Running}}' avengine-runtime)
          if [[ "${running}" != "true" ]]; then
            echo "::error::Container avengine-runtime is not running. Restore the long-lived runtime service before refreshing the profiling corpus."
            exit 1
          fi
          docker exec avengine-runtime /usr/local/bin/av-status | tee /tmp/avengine-status.txt
          if ! grep -q "crawler supervisor: running" /tmp/avengine-status.txt; then
            echo "::error::Crawler supervisor is not running inside avengine-runtime. The live crawl service must run continuously on the runtime host."
            exit 1
          fi
          if ! grep -q "aggregate watcher: running" /tmp/avengine-status.txt; then
            echo "::error::Aggregate watcher is not running inside avengine-runtime. The runtime host must keep the live corpus refreshed continuously."
            exit 1
          fi

      - name: Repair runtime corpus ownership
        shell: bash
        run: |
          docker exec -u root avengine-runtime bash -lc '
            set -euo pipefail
            for dir in /var/lib/avengine/corpus-index /var/lib/avengine/corpus-profile; do
              install -d -o engine -g engine -m 755 "${dir}" "${dir}/generations"
              if find "${dir}" \( ! -user engine -o ! -group engine \) -print -quit | grep -q .; then
                chown -R engine:engine "${dir}"
              fi
            done
          '

      - name: Refresh aggregated corpus from the live runtime service
        shell: bash
        run: |
          docker exec -u engine avengine-runtime /opt/avengine/bin/aggregate-corpus-index.sh

      - name: Promote corpus profile snapshot
        shell: bash
        run: |
          docker exec -u engine avengine-runtime /usr/local/bin/av-promote-corpus-profile

      - name: Copy crawl artifacts locally
        shell: bash
        run: |
          rm -rf artifacts/live-crawl live-corpus
          mkdir -p artifacts/live-crawl live-corpus
          docker cp avengine-runtime:/var/lib/avengine/logs/. artifacts/live-crawl/logs
          docker cp avengine-runtime:/var/lib/avengine/aggregate.log artifacts/live-crawl/aggregate.log
          docker cp avengine-runtime:/var/lib/avengine/corpus-profile/current/. live-corpus

      - name: Validate promoted corpus profile
        shell: bash
        run: |
          count=$(find live-corpus -maxdepth 1 -type f -name '*.sfi' | wc -l | tr -d ' ')
          echo "Promoted corpus profile shard count: ${count}"
          echo "Promoted corpus profile shard count: ${count}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::Corpus promotion succeeded but /var/lib/avengine/corpus-profile/current is empty"
            exit 1
          fi

      - name: Run corpus profile against promoted corpus
        shell: bash
        run: |
          bash profiling/scripts/profile_query_pipeline.sh \
            --index-dir live-corpus \
            --iterations "${CORPUS_PROFILE_ITERATIONS}" \
            --output artifacts/live-crawl/corpus_profile.json \
            2>&1 | tee /dev/stderr | grep -v "^$" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live crawl artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-internet-crawl
          path: artifacts/live-crawl/
