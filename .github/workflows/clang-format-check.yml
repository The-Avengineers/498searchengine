name: Clang-Format Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hh')

          if [ -z "$files" ]; then
            echo "No C/C++ source files to format."
            exit 0
          fi

          clang-format -i $files

          if ! git diff --quiet; then
            echo "::error ::Code is not clang-formatted. Please run clang-format locally and commit the changes."
            git --no-pager diff
            exit 1
          fi

          echo "All files are properly formatted."
