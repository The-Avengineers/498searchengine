<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Results - Avengine</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <script defer src="./scripts/results.js"></script>
  </head>
  <body>
    <header class="results-header">
      <div class="results-header-inner">
        <a class="home-link" href="./index.html" aria-label="Back to search home">
          <img class="logo-image logo-image-small" src="./media/logo.png" alt="Avengine logo" />
        </a>
        <form class="search-form results-search-form" action="./results.html" method="get">
          <label class="sr-only" for="results-query">Search query</label>
          <input
            id="results-query"
            class="search-input"
            type="text"
            name="q"
            placeholder="Search..."
            autocomplete="off"
            required
          />
        </form>
      </div>
    </header>

    <main class="results-shell">
      <section class="results-block">
        <p class="results-count" id="results-count" role="status" aria-live="polite"></p>
        <p class="results-feedback" id="results-feedback" role="alert" hidden></p>
        <ol class="results-list" id="results-list"></ol>
      </section>
    </main>
  </body>
</html>
